<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Pong Néon Pro</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
      }

      body {
        background: linear-gradient(
          135deg,
          #0a0e1a 0%,
          #1a1f35 50%,
          #0d1520 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        overflow: hidden;
        color: #fff;
      }

      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      #canvas {
        border: 3px solid #00ffff;
        border-radius: 10px;
        box-shadow:
          0 0 30px rgba(0, 255, 255, 0.3),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
        background: rgba(10, 14, 26, 0.9);
      }

      /* ===== HUD ===== */
      .hud {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 800px;
        padding: 0 20px;
        font-size: 18px;
        color: #00ffff;
      }

      .hud-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .hud-label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .hud-value {
        font-size: 32px;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      }

      .hud-center {
        text-align: center;
      }

      .game-mode {
        font-size: 14px;
        color: #ff00ff;
      }

      /* ===== OVERLAYS ===== */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 14, 26, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(10px);
      }

      .overlay.hidden {
        display: none;
      }

      .menu {
        background: linear-gradient(180deg, #1a2035 0%, #0d1225 100%);
        border: 2px solid #00ffff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        max-width: 450px;
        width: 90%;
        box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        animation: menuSlide 0.3s ease-out;
      }

      @keyframes menuSlide {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .menu h1 {
        font-size: 56px;
        background: linear-gradient(90deg, #00ffff, #00ff9f, #ff00ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        margin-bottom: 10px;
        letter-spacing: 3px;
      }

      .menu .subtitle {
        color: #888;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .menu h2 {
        font-size: 28px;
        color: #00ffff;
        margin-bottom: 20px;
      }

      .menu-btn {
        display: block;
        width: 100%;
        padding: 16px 30px;
        margin: 12px 0;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(135deg, #00ffff, #0088ff);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .menu-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0, 255, 255, 0.5);
      }

      .menu-btn.secondary {
        background: linear-gradient(135deg, #ff00ff, #8800ff);
        box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
      }

      .menu-btn.secondary:hover {
        box-shadow: 0 6px 25px rgba(255, 0, 255, 0.5);
      }

      .menu-btn.tertiary {
        background: linear-gradient(135deg, #333, #555);
        box-shadow: 0 4px 15px rgba(100, 100, 100, 0.3);
      }

      .menu-btn.settings-back {
        color: #f5e9ff;
        border: 1px solid rgba(255, 0, 255, 0.62);
        background: linear-gradient(
          135deg,
          rgba(15, 28, 58, 0.96),
          rgba(72, 18, 104, 0.92)
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 4px 18px rgba(136, 0, 255, 0.28);
      }

      .menu-btn.settings-back:hover {
        color: #ffffff;
        border-color: #00ffff;
        background: linear-gradient(
          135deg,
          rgba(0, 96, 128, 0.96),
          rgba(118, 24, 156, 0.94)
        );
        box-shadow:
          0 6px 25px rgba(255, 0, 255, 0.35),
          0 0 16px rgba(0, 255, 255, 0.24);
      }

      /* ===== PARAMÈTRES ===== */
      .setting-group {
        margin: 20px 0;
        text-align: left;
      }

      .setting-group label {
        display: block;
        color: #00ffff;
        margin-bottom: 8px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .setting-group select,
      .setting-group input[type="range"] {
        width: 100%;
        padding: 10px;
        background: rgba(0, 255, 255, 0.1);
        border: 1px solid #00ffff;
        border-radius: 8px;
        color: #fff;
        font-size: 14px;
      }

      .setting-group select {
        appearance: none;
        -webkit-appearance: none;
        color-scheme: dark;
        cursor: pointer;
        padding-right: 42px;
        color: #ecfeff;
        background-color: #071522;
        background-image:
          linear-gradient(45deg, transparent 50%, #00ffff 50%),
          linear-gradient(135deg, #00ffff 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 50%,
          calc(100% - 12px) 50%;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
        box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.06);
      }

      .setting-group select:hover {
        border-color: #ff00ff;
        box-shadow: 0 0 14px rgba(255, 0, 255, 0.22);
      }

      .setting-group select:focus,
      .setting-group select:focus-visible {
        outline: none;
        border-color: #00ffff;
        box-shadow:
          0 0 0 3px rgba(0, 255, 255, 0.16),
          0 0 18px rgba(0, 255, 255, 0.24);
      }

      .setting-group select option {
        color: #ecfeff;
        background-color: #071522;
      }

      .setting-group select option:checked {
        color: #ffffff;
        background-color: #0e7490;
      }

      .setting-group input[type="range"] {
        cursor: pointer;
      }

      .slider-value {
        float: right;
        color: #ff00ff;
        font-weight: bold;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
      }

      .checkbox-group input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }

      /* ===== STATS ===== */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 20px 0;
      }

      .stat-item {
        background: rgba(0, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(0, 255, 255, 0.3);
      }

      .stat-item .label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
      }

      .stat-item .value {
        font-size: 24px;
        color: #00ffff;
        font-weight: bold;
        margin-top: 5px;
      }

      /* ===== RECORDS ===== */
      .records-list {
        max-height: 300px;
        overflow-y: auto;
        margin: 20px 0;
      }

      .record-item {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        margin: 8px 0;
        background: rgba(0, 255, 255, 0.1);
        border-radius: 8px;
        border-left: 3px solid #00ffff;
      }

      .record-item.gold {
        border-left-color: #ffd700;
        background: rgba(255, 215, 0, 0.1);
      }

      .record-item.silver {
        border-left-color: #c0c0c0;
      }

      .record-item.bronze {
        border-left-color: #cd7f32;
      }

      .record-item .info {
        text-align: left;
      }

      .record-item .mode {
        font-size: 12px;
        color: #888;
      }

      .record-item .score {
        font-size: 20px;
        color: #00ffff;
        font-weight: bold;
      }

      /* ===== CONTRÔLES ===== */
      .controls-help {
        margin-top: 20px;
        padding: 15px;
        background: rgba(0, 255, 255, 0.1);
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.6;
      }

      .controls-help .key {
        display: inline-block;
        padding: 3px 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        font-family: monospace;
        margin: 0 3px;
      }

      /* ===== MOBILE ===== */
      #touch-controls {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        gap: 20px;
      }

      #touch-controls.active {
        display: flex;
      }

      .touch-btn {
        width: 80px;
        height: 80px;
        background: rgba(0, 255, 255, 0.2);
        border: 2px solid #00ffff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #00ffff;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        user-select: none;
      }

      .touch-btn:active {
        background: rgba(0, 255, 255, 0.4);
        transform: scale(0.95);
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 768px) {
        .menu {
          padding: 30px 20px;
        }

        .menu h1 {
          font-size: 40px;
        }

        .hud-value {
          font-size: 24px;
        }

        .stats-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ===== SCROLLBAR ===== */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #00ffff, #0088ff);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #00ff9f, #00ffff);
      }
    </style>
    <link rel="stylesheet" href="arcade-home.css" />
  </head>
  <body>
    <a
      class="arcade-home-link"
      href="index.html"
      aria-label="Retour à l'accueil"
      title="Retour à l'accueil"
      ><span class="arcade-home-icon" aria-hidden="true">⌂</span
      ><span class="arcade-home-label">Accueil</span></a
    >

    <!-- HUD -->
    <div id="game-container">
      <div class="hud">
        <div class="hud-section">
          <div class="hud-label">Joueur 1</div>
          <div class="hud-value" id="score-p1">0</div>
        </div>

        <div class="hud-section hud-center">
          <div class="game-mode" id="current-mode">Classique</div>
          <div class="hud-label" id="timer-label">Temps</div>
          <div class="hud-value" id="timer">0:00</div>
        </div>

        <div class="hud-section">
          <div class="hud-label" id="p2-label">Joueur 2</div>
          <div class="hud-value" id="score-p2">0</div>
        </div>
      </div>

      <canvas id="canvas"></canvas>
    </div>

    <!-- Contrôles tactiles -->
    <div id="touch-controls">
      <div class="touch-btn" id="touch-up">▲</div>
      <div class="touch-btn" id="touch-down">▼</div>
    </div>

    <!-- Menu Principal -->
    <div id="main-menu" class="overlay">
      <div class="menu">
        <h1>PONG</h1>
        <p class="subtitle">Version Néon Pro v2.0</p>

        <button class="menu-btn" onclick="startGame('classic')">
          🎮 Mode Classique
        </button>
        <button class="menu-btn" onclick="startGame('timed')">
          ⏱️ Contre-la-montre
        </button>
        <button class="menu-btn" onclick="startGame('survival')">
          💀 Mode Survie
        </button>
        <button class="menu-btn" onclick="startGame('powerup')">
          ⚡ Power-Ups
        </button>
        <button class="menu-btn secondary" onclick="showSettings()">
          ⚙️ Paramètres
        </button>
        <button class="menu-btn secondary" onclick="showRecords()">
          🏆 Records
        </button>

        <div class="controls-help">
          <strong>Contrôles :</strong><br />
          Joueur 1: <span class="key">W</span> <span class="key">S</span><br />
          Joueur 2: <span class="key">↑</span> <span class="key">↓</span><br />
          Pause: <span class="key">Espace</span> ou
          <span class="key">Échap</span>
        </div>
      </div>
    </div>

    <!-- Menu Pause -->
    <div id="pause-menu" class="overlay hidden">
      <div class="menu">
        <h2>⏸️ PAUSE</h2>

        <button class="menu-btn" onclick="resumeGame()">▶️ Reprendre</button>
        <button class="menu-btn secondary" onclick="restartGame()">
          🔄 Recommencer
        </button>
        <button class="menu-btn tertiary" onclick="quitToMenu()">
          🏠 Menu Principal
        </button>
      </div>
    </div>

    <!-- Menu Game Over -->
    <div id="gameover-menu" class="overlay hidden">
      <div class="menu">
        <h2>🏁 PARTIE TERMINÉE</h2>

        <div class="stats-grid" id="gameover-stats"></div>

        <div
          id="new-record"
          style="display: none; color: #ffd700; font-size: 20px; margin: 15px 0"
        >
          🏆 NOUVEAU RECORD ! 🏆
        </div>

        <button class="menu-btn" onclick="restartGame()">🔄 Rejouer</button>
        <button class="menu-btn secondary" onclick="quitToMenu()">
          🏠 Menu Principal
        </button>
      </div>
    </div>

    <!-- Menu Paramètres -->
    <div id="settings-menu" class="overlay hidden">
      <div class="menu">
        <h2>⚙️ PARAMÈTRES</h2>

        <div class="setting-group">
          <label>
            Volume SFX
            <span class="slider-value" id="sfx-display">70%</span>
          </label>
          <input
            type="range"
            id="sfx-vol"
            min="0"
            max="100"
            value="70"
            oninput="
              document.getElementById('sfx-display').textContent =
                this.value + '%'
            "
          />
        </div>

        <div class="setting-group">
          <label>Difficulté IA</label>
          <select id="ai-difficulty">
            <option value="easy">Facile</option>
            <option value="medium" selected>Moyen</option>
            <option value="hard">Difficile</option>
            <option value="impossible">Impossible</option>
          </select>
        </div>

        <div class="setting-group">
          <label>Vitesse initiale balle</label>
          <select id="ball-speed">
            <option value="slow">Lente</option>
            <option value="normal" selected>Normale</option>
            <option value="fast">Rapide</option>
          </select>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="show-trail" checked />
          <label for="show-trail">Traînée de balle</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="show-particles" checked />
          <label for="show-particles">Particules</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="screen-shake" checked />
          <label for="screen-shake">Secousse écran</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="touch-enabled" checked />
          <label for="touch-enabled">Contrôles tactiles (mobile)</label>
        </div>

        <button class="menu-btn" onclick="saveSettings()">
          ✅ Sauvegarder
        </button>
        <button class="menu-btn settings-back" onclick="hideSettings()">
          ← Retour
        </button>
      </div>
    </div>

    <!-- Menu Records -->
    <div id="records-menu" class="overlay hidden">
      <div class="menu">
        <h2>🏆 RECORDS</h2>

        <div class="records-list" id="records-list"></div>

        <button class="menu-btn tertiary" onclick="clearRecords()">
          🗑️ Effacer tout
        </button>
        <button class="menu-btn tertiary" onclick="hideRecords()">
          ← Retour
        </button>
      </div>
    </div>

    <script>
      // ============================================
      // CLASSE PRINCIPALE DU JEU
      // ============================================
      class PongGame {
        constructor() {
          this.canvas = document.getElementById("canvas");
          this.ctx = this.canvas.getContext("2d");

          // Dimensions
          this.width = 800;
          this.height = 600;
          this.canvas.width = this.width;
          this.canvas.height = this.height;

          // État du jeu
          this.running = false;
          this.paused = false;
          this.gameMode = "classic";
          this.gameTime = 0;
          this.startTime = 0;

          // Scores
          this.scoreP1 = 0;
          this.scoreP2 = 0;
          this.maxScore = 11; // Premier à 11

          // Paramètres
          this.settings = this.loadSettings();

          // Records
          this.records = this.loadRecords();

          // Initialisation
          this.initAudio();
          this.initParticles();
          this.initEntities();
          this.initInput();
          this.initPowerUps();

          // Boucle de jeu
          this.lastTime = 0;
          this.accumulator = 0;
          this.fixedDelta = 1000 / 60; // 60 FPS

          // Shake
          this.shake = { x: 0, y: 0, intensity: 0 };
        }

        // ============================================
        // INITIALISATION
        // ============================================

        initEntities() {
          // Palettes
          const paddleWidth = 15;
          const paddleHeight = 100;
          const paddleSpeed = 6;

          this.paddle1 = {
            x: 30,
            y: this.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: paddleSpeed,
            dy: 0,
            color: "#00ffff",
          };

          this.paddle2 = {
            x: this.width - 30 - paddleWidth,
            y: this.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: paddleSpeed,
            dy: 0,
            color: "#ff00ff",
            isAI: true,
          };

          // Balle
          this.resetBall();

          // Trail
          this.trail = [];
        }

        resetBall() {
          const speedMultiplier =
            {
              slow: 0.7,
              normal: 1,
              fast: 1.3,
            }[this.settings.ballSpeed] || 1;

          const baseSpeed = 5 * speedMultiplier;
          const angle = ((Math.random() - 0.5) * Math.PI) / 3; // -30° à +30°
          const direction = Math.random() < 0.5 ? 1 : -1;

          this.ball = {
            x: this.width / 2,
            y: this.height / 2,
            radius: 8,
            speed: baseSpeed,
            dx: Math.cos(angle) * baseSpeed * direction,
            dy: Math.sin(angle) * baseSpeed,
            color: "#ffffff",
            maxSpeed: baseSpeed * 2,
          };

          this.trail = [];
        }

        initAudio() {
          const audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();

          this.audio = {
            ctx: audioContext,
            volume: this.settings.sfxVolume / 100,

            playHit: () => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              osc.connect(gain);
              gain.connect(audioContext.destination);

              osc.frequency.value = 220;
              gain.gain.setValueAtTime(
                this.audio.volume * 0.3,
                audioContext.currentTime,
              );
              gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioContext.currentTime + 0.1,
              );

              osc.start();
              osc.stop(audioContext.currentTime + 0.1);
            },

            playWall: () => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              osc.connect(gain);
              gain.connect(audioContext.destination);

              osc.frequency.value = 150;
              gain.gain.setValueAtTime(
                this.audio.volume * 0.2,
                audioContext.currentTime,
              );
              gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioContext.currentTime + 0.08,
              );

              osc.start();
              osc.stop(audioContext.currentTime + 0.08);
            },

            playScore: () => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              osc.connect(gain);
              gain.connect(audioContext.destination);

              osc.frequency.setValueAtTime(440, audioContext.currentTime);
              osc.frequency.exponentialRampToValueAtTime(
                880,
                audioContext.currentTime + 0.2,
              );
              gain.gain.setValueAtTime(
                this.audio.volume * 0.4,
                audioContext.currentTime,
              );
              gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioContext.currentTime + 0.2,
              );

              osc.start();
              osc.stop(audioContext.currentTime + 0.2);
            },

            playPowerUp: () => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              osc.connect(gain);
              gain.connect(audioContext.destination);

              osc.type = "sine";
              osc.frequency.setValueAtTime(523, audioContext.currentTime);
              osc.frequency.exponentialRampToValueAtTime(
                1046,
                audioContext.currentTime + 0.3,
              );
              gain.gain.setValueAtTime(
                this.audio.volume * 0.3,
                audioContext.currentTime,
              );
              gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioContext.currentTime + 0.3,
              );

              osc.start();
              osc.stop(audioContext.currentTime + 0.3);
            },
          };
        }

        initParticles() {
          this.particles = {
            list: [],
            enabled: this.settings.showParticles,

            spawn: (x, y, count, color) => {
              if (!this.particles.enabled) return;

              for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = 2 + Math.random() * 3;

                this.particles.list.push({
                  x,
                  y,
                  dx: Math.cos(angle) * speed,
                  dy: Math.sin(angle) * speed,
                  life: 1,
                  decay: 0.02,
                  size: 3 + Math.random() * 3,
                  color: color || "#00ffff",
                });
              }
            },

            update: () => {
              for (let i = this.particles.list.length - 1; i >= 0; i--) {
                const p = this.particles.list[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= p.decay;
                p.dy += 0.1; // Gravité

                if (p.life <= 0) {
                  this.particles.list.splice(i, 1);
                }
              }
            },

            draw: (ctx) => {
              this.particles.list.forEach((p) => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
              });
              ctx.globalAlpha = 1;
            },
          };
        }

        initPowerUps() {
          this.powerUps = {
            active: [],
            spawned: [],
            nextSpawnTime: 0,

            types: [
              {
                name: "speed",
                color: "#ff0000",
                icon: "⚡",
                effect: "speedBoost",
              },
              {
                name: "slow",
                color: "#0000ff",
                icon: "❄️",
                effect: "slowBall",
              },
              {
                name: "big",
                color: "#00ff00",
                icon: "⬆️",
                effect: "bigPaddle",
              },
              {
                name: "multi",
                color: "#ffff00",
                icon: "✨",
                effect: "multiBall",
              },
            ],

            spawn: () => {
              if (this.gameMode !== "powerup") return;
              if (this.powerUps.spawned.length >= 1) return;

              const type =
                this.powerUps.types[
                  Math.floor(Math.random() * this.powerUps.types.length)
                ];

              this.powerUps.spawned.push({
                x: this.width / 2,
                y: 100 + Math.random() * (this.height - 200),
                size: 20,
                type: type,
                rotation: 0,
              });
            },

            update: () => {
              // Rotation des power-ups
              this.powerUps.spawned.forEach((p) => {
                p.rotation += 0.05;
              });

              // Vérifier collision avec balle
              for (let i = this.powerUps.spawned.length - 1; i >= 0; i--) {
                const p = this.powerUps.spawned[i];
                const dist = Math.hypot(this.ball.x - p.x, this.ball.y - p.y);

                if (dist < this.ball.radius + p.size) {
                  this.activatePowerUp(p.type);
                  this.powerUps.spawned.splice(i, 1);
                  this.particles.spawn(p.x, p.y, 15, p.type.color);
                  this.audio.playPowerUp();
                }
              }

              // Décompte des effets actifs
              for (let i = this.powerUps.active.length - 1; i >= 0; i--) {
                this.powerUps.active[i].duration -= 16;
                if (this.powerUps.active[i].duration <= 0) {
                  this.deactivatePowerUp(this.powerUps.active[i]);
                  this.powerUps.active.splice(i, 1);
                }
              }
            },

            draw: (ctx) => {
              this.powerUps.spawned.forEach((p) => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);

                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = p.type.color;

                // Carré
                ctx.fillStyle = p.type.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);

                // Icône
                ctx.shadowBlur = 0;
                ctx.font = "16px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#000";
                ctx.fillText(p.type.icon, 0, 0);

                ctx.restore();
              });
            },
          };
        }

        activatePowerUp(type) {
          const duration = 5000; // 5 secondes

          switch (type.effect) {
            case "speedBoost":
              this.ball.speed *= 1.5;
              break;
            case "slowBall":
              this.ball.speed *= 0.6;
              break;
            case "bigPaddle":
              this.paddle1.height *= 1.5;
              this.paddle2.height *= 1.5;
              break;
            case "multiBall":
              // TODO: implémenter multi-balles
              break;
          }

          this.powerUps.active.push({ type, duration, effect: type.effect });
        }

        deactivatePowerUp(powerUp) {
          switch (powerUp.effect) {
            case "speedBoost":
              this.ball.speed /= 1.5;
              break;
            case "slowBall":
              this.ball.speed /= 0.6;
              break;
            case "bigPaddle":
              this.paddle1.height /= 1.5;
              this.paddle2.height /= 1.5;
              break;
          }
        }

        initInput() {
          this.keys = {};

          // Clavier
          window.addEventListener("keydown", (e) => {
            this.keys[e.key.toLowerCase()] = true;

            // Pause
            if (e.key === " " || e.key === "Escape") {
              e.preventDefault();
              if (this.running) {
                this.togglePause();
              }
            }
          });

          window.addEventListener("keyup", (e) => {
            this.keys[e.key.toLowerCase()] = false;
          });

          // Tactile
          const touchUp = document.getElementById("touch-up");
          const touchDown = document.getElementById("touch-down");

          touchUp.addEventListener("touchstart", (e) => {
            e.preventDefault();
            this.paddle1.dy = -this.paddle1.speed;
          });

          touchUp.addEventListener("touchend", () => {
            this.paddle1.dy = 0;
          });

          touchDown.addEventListener("touchstart", (e) => {
            e.preventDefault();
            this.paddle1.dy = this.paddle1.speed;
          });

          touchDown.addEventListener("touchend", () => {
            this.paddle1.dy = 0;
          });
        }

        // ============================================
        // BOUCLE DE JEU
        // ============================================

        start(mode) {
          this.gameMode = mode;
          this.running = true;
          this.paused = false;
          this.scoreP1 = 0;
          this.scoreP2 = 0;
          this.gameTime = 0;
          this.startTime = Date.now();

          // Configuration selon mode
          switch (mode) {
            case "classic":
              this.maxScore = 11;
              this.paddle2.isAI = true;
              document.getElementById("timer-label").textContent = "Temps";
              break;

            case "timed":
              this.maxScore = 999;
              this.paddle2.isAI = true;
              this.gameTime = 60000; // 60 secondes
              document.getElementById("timer-label").textContent =
                "Temps restant";
              break;

            case "survival":
              this.maxScore = 999;
              this.paddle2.isAI = true;
              this.ball.speed *= 1.3;
              document.getElementById("timer-label").textContent = "Survie";
              break;

            case "powerup":
              this.maxScore = 11;
              this.paddle2.isAI = true;
              this.powerUps.nextSpawnTime = 3000;
              document.getElementById("timer-label").textContent = "Temps";
              break;
          }

          this.resetBall();
          this.initEntities();

          // Affichage
          document.getElementById("current-mode").textContent = {
            classic: "Classique",
            timed: "Contre-la-montre",
            survival: "Survie",
            powerup: "Power-Ups",
          }[mode];

          // Contrôles tactiles
          if (this.settings.touchEnabled && "ontouchstart" in window) {
            document.getElementById("touch-controls").classList.add("active");
          }

          this.lastTime = performance.now();
          this.gameLoop(this.lastTime);
          this.updateDisplay();
        }

        gameLoop(currentTime) {
          if (!this.running) return;

          const deltaTime = currentTime - this.lastTime;
          this.lastTime = currentTime;

          if (!this.paused) {
            // Fixed timestep
            this.accumulator += deltaTime;

            while (this.accumulator >= this.fixedDelta) {
              this.update(this.fixedDelta);
              this.accumulator -= this.fixedDelta;
            }

            // Temps
            if (this.gameMode === "timed") {
              this.gameTime -= deltaTime;
              if (this.gameTime <= 0) {
                this.gameTime = 0;
                this.endGame();
              }
            } else {
              this.gameTime += deltaTime;
            }

            // Spawn power-ups
            if (this.gameMode === "powerup") {
              this.powerUps.nextSpawnTime -= deltaTime;
              if (this.powerUps.nextSpawnTime <= 0) {
                this.powerUps.spawn();
                this.powerUps.nextSpawnTime = 5000 + Math.random() * 5000;
              }
            }

            this.updateDisplay();
          }

          this.render();

          requestAnimationFrame((t) => this.gameLoop(t));
        }

        update(dt) {
          // Contrôles Joueur 1
          this.paddle1.dy = 0;
          if (this.keys["w"] || this.keys["arrowup"]) {
            this.paddle1.dy = -this.paddle1.speed;
          }
          if (this.keys["s"] || this.keys["arrowdown"]) {
            this.paddle1.dy = this.paddle1.speed;
          }

          // IA Joueur 2
          if (this.paddle2.isAI) {
            this.updateAI();
          } else {
            this.paddle2.dy = 0;
            if (this.keys["arrowup"]) {
              this.paddle2.dy = -this.paddle2.speed;
            }
            if (this.keys["arrowdown"]) {
              this.paddle2.dy = this.paddle2.speed;
            }
          }

          // Mouvement palettes
          this.paddle1.y += this.paddle1.dy;
          this.paddle2.y += this.paddle2.dy;

          // Limites palettes
          this.paddle1.y = Math.max(
            0,
            Math.min(this.height - this.paddle1.height, this.paddle1.y),
          );
          this.paddle2.y = Math.max(
            0,
            Math.min(this.height - this.paddle2.height, this.paddle2.y),
          );

          // Mouvement balle
          this.ball.x += this.ball.dx;
          this.ball.y += this.ball.dy;

          // Trail
          if (this.settings.showTrail) {
            this.trail.push({ x: this.ball.x, y: this.ball.y, life: 1 });
            if (this.trail.length > 15) {
              this.trail.shift();
            }
            this.trail.forEach((t) => (t.life -= 0.05));
          }

          // Collision murs haut/bas
          if (
            this.ball.y - this.ball.radius < 0 ||
            this.ball.y + this.ball.radius > this.height
          ) {
            this.ball.dy *= -1;
            this.ball.y = Math.max(
              this.ball.radius,
              Math.min(this.height - this.ball.radius, this.ball.y),
            );
            this.audio.playWall();
            this.particles.spawn(this.ball.x, this.ball.y, 8, "#ffffff");
          }

          // Collision palettes
          this.checkPaddleCollision(this.paddle1);
          this.checkPaddleCollision(this.paddle2);

          // Score
          if (this.ball.x - this.ball.radius < 0) {
            this.scoreP2++;
            this.audio.playScore();
            this.particles.spawn(this.ball.x, this.ball.y, 20, "#ff00ff");
            this.screenShake(10);
            this.resetBall();

            if (this.scoreP2 >= this.maxScore) {
              this.endGame();
            }
          }

          if (this.ball.x + this.ball.radius > this.width) {
            this.scoreP1++;
            this.audio.playScore();
            this.particles.spawn(this.ball.x, this.ball.y, 20, "#00ffff");
            this.screenShake(10);
            this.resetBall();

            if (this.scoreP1 >= this.maxScore) {
              this.endGame();
            }
          }

          // Power-ups
          this.powerUps.update();

          // Particules
          this.particles.update();

          // Screen shake
          if (this.shake.intensity > 0) {
            this.shake.intensity *= 0.9;
            if (this.shake.intensity < 0.1) {
              this.shake.intensity = 0;
              this.shake.x = 0;
              this.shake.y = 0;
            } else {
              this.shake.x = (Math.random() - 0.5) * this.shake.intensity;
              this.shake.y = (Math.random() - 0.5) * this.shake.intensity;
            }
          }
        }

        checkPaddleCollision(paddle) {
          if (
            this.ball.x - this.ball.radius < paddle.x + paddle.width &&
            this.ball.x + this.ball.radius > paddle.x &&
            this.ball.y + this.ball.radius > paddle.y &&
            this.ball.y - this.ball.radius < paddle.y + paddle.height
          ) {
            // Position relative de la collision
            const relativeY =
              (this.ball.y - (paddle.y + paddle.height / 2)) /
              (paddle.height / 2);
            const bounceAngle = relativeY * (Math.PI / 3); // Max 60°

            // Augmenter vitesse
            this.ball.speed = Math.min(
              this.ball.speed * 1.05,
              this.ball.maxSpeed,
            );

            // Nouvelle direction
            const direction = paddle === this.paddle1 ? 1 : -1;
            this.ball.dx = Math.cos(bounceAngle) * this.ball.speed * direction;
            this.ball.dy = Math.sin(bounceAngle) * this.ball.speed;

            // Empêcher de rester coincé
            if (paddle === this.paddle1) {
              this.ball.x = paddle.x + paddle.width + this.ball.radius;
            } else {
              this.ball.x = paddle.x - this.ball.radius;
            }

            this.audio.playHit();
            this.particles.spawn(this.ball.x, this.ball.y, 10, paddle.color);
            this.screenShake(5);
          }
        }

        updateAI() {
          const difficulty = this.settings.aiDifficulty;

          // Prédiction de position
          const predictedY = this.ball.y + this.ball.dy * 20;
          const paddleCenter = this.paddle2.y + this.paddle2.height / 2;

          // Réaction selon difficulté
          let reactionZone = 50;
          let speedMultiplier = 1;

          switch (difficulty) {
            case "easy":
              reactionZone = 80;
              speedMultiplier = 0.7;
              break;
            case "medium":
              reactionZone = 50;
              speedMultiplier = 0.85;
              break;
            case "hard":
              reactionZone = 30;
              speedMultiplier = 1;
              break;
            case "impossible":
              reactionZone = 5;
              speedMultiplier = 1.2;
              break;
          }

          // Déplacement
          if (predictedY < paddleCenter - reactionZone) {
            this.paddle2.dy = -this.paddle2.speed * speedMultiplier;
          } else if (predictedY > paddleCenter + reactionZone) {
            this.paddle2.dy = this.paddle2.speed * speedMultiplier;
          } else {
            this.paddle2.dy = 0;
          }
        }

        screenShake(intensity) {
          if (this.settings.screenShake) {
            this.shake.intensity = intensity;
          }
        }

        // ============================================
        // RENDU
        // ============================================

        render() {
          const ctx = this.ctx;

          ctx.save();
          ctx.translate(this.shake.x, this.shake.y);

          // Fond
          ctx.fillStyle = "rgba(10, 14, 26, 0.3)";
          ctx.fillRect(0, 0, this.width, this.height);

          // Ligne centrale
          ctx.strokeStyle = "rgba(0, 255, 255, 0.2)";
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 10]);
          ctx.beginPath();
          ctx.moveTo(this.width / 2, 0);
          ctx.lineTo(this.width / 2, this.height);
          ctx.stroke();
          ctx.setLineDash([]);

          // Trail balle
          if (this.settings.showTrail && this.trail.length > 0) {
            this.trail.forEach((t, i) => {
              ctx.globalAlpha = t.life * 0.5;
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(t.x, t.y, this.ball.radius * t.life, 0, Math.PI * 2);
              ctx.fill();
            });
            ctx.globalAlpha = 1;
          }

          // Palettes avec glow
          this.drawPaddle(this.paddle1);
          this.drawPaddle(this.paddle2);

          // Balle avec glow
          ctx.shadowBlur = 20;
          ctx.shadowColor = this.ball.color;
          ctx.fillStyle = this.ball.color;
          ctx.beginPath();
          ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Power-ups
          this.powerUps.draw(ctx);

          // Particules
          this.particles.draw(ctx);

          // Power-ups actifs (indicateurs)
          if (this.powerUps.active.length > 0) {
            ctx.font = "14px Arial";
            ctx.fillStyle = "#ffff00";
            ctx.textAlign = "left";
            this.powerUps.active.forEach((p, i) => {
              const timeLeft = (p.duration / 1000).toFixed(1);
              ctx.fillText(`${p.type.icon} ${timeLeft}s`, 10, 30 + i * 25);
            });
          }

          ctx.restore();
        }

        drawPaddle(paddle) {
          const ctx = this.ctx;

          // Glow
          ctx.shadowBlur = 15;
          ctx.shadowColor = paddle.color;

          // Paddle
          ctx.fillStyle = paddle.color;
          ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

          // Bordure
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);

          ctx.shadowBlur = 0;
        }

        // ============================================
        // GESTION DU JEU
        // ============================================

        togglePause() {
          this.paused = !this.paused;

          if (this.paused) {
            document.getElementById("pause-menu").classList.remove("hidden");
          } else {
            document.getElementById("pause-menu").classList.add("hidden");
          }
        }

        endGame() {
          this.running = false;

          // Calculer statistiques
          const winner = this.scoreP1 > this.scoreP2 ? "Joueur 1" : "Joueur 2";
          if (winner === "Joueur 1") window.ArcadeGameSession?.win({ scoreP1: this.scoreP1, scoreP2: this.scoreP2 });
          else window.ArcadeGameSession?.lose({ scoreP1: this.scoreP1, scoreP2: this.scoreP2 });
          const finalScore = Math.max(this.scoreP1, this.scoreP2);
          const timeSeconds = Math.floor(this.gameTime / 1000);

          // Vérifier nouveau record
          const isRecord = this.saveRecord({
            mode: this.gameMode,
            score: finalScore,
            time: this.gameTime,
            winner: winner,
          });

          // Afficher stats
          showGameOver(isRecord);
        }

        // ============================================
        // PERSISTANCE
        // ============================================

        loadSettings() {
          const saved = localStorage.getItem("pong-settings");
          const defaults = {
            sfxVolume: 70,
            aiDifficulty: "medium",
            ballSpeed: "normal",
            showTrail: true,
            showParticles: true,
            screenShake: true,
            touchEnabled: true,
          };

          return saved ? { ...defaults, ...JSON.parse(saved) } : defaults;
        }

        saveSettings() {
          localStorage.setItem("pong-settings", JSON.stringify(this.settings));
          this.applySettings();
        }

        applySettings() {
          this.audio.volume = this.settings.sfxVolume / 100;
          this.particles.enabled = this.settings.showParticles;

          if (this.settings.touchEnabled && "ontouchstart" in window) {
            document.getElementById("touch-controls").classList.add("active");
          } else {
            document
              .getElementById("touch-controls")
              .classList.remove("active");
          }
        }

        loadRecords() {
          const saved = localStorage.getItem("pong-records");
          return saved ? JSON.parse(saved) : [];
        }

        saveRecord(record) {
          record.date = Date.now();
          this.records.push(record);

          // Trier par score
          this.records.sort((a, b) => b.score - a.score);

          // Garder top 10
          this.records = this.records.slice(0, 10);

          localStorage.setItem("pong-records", JSON.stringify(this.records));

          // Retourner true si dans le top 3
          return this.records.indexOf(record) < 3;
        }

        updateDisplay() {
          document.getElementById("score-p1").textContent = this.scoreP1;
          document.getElementById("score-p2").textContent = this.scoreP2;

          // Timer
          if (this.gameMode === "timed") {
            const secs = Math.ceil(this.gameTime / 1000);
            document.getElementById("timer").textContent =
              `0:${secs.toString().padStart(2, "0")}`;
          } else {
            const secs = Math.floor(this.gameTime / 1000);
            const mins = Math.floor(secs / 60);
            document.getElementById("timer").textContent =
              `${mins}:${(secs % 60).toString().padStart(2, "0")}`;
          }
        }
      }

      // ============================================
      // INSTANCE GLOBALE
      // ============================================
      let game;

      function initGame() {
        game = new PongGame();
      }

      // ============================================
      // FONCTIONS UI
      // ============================================

      function startGame(mode) {
        window.ArcadeGameSession?.start({ mode });
        document.getElementById("main-menu").classList.add("hidden");
        game.start(mode);
      }

      function resumeGame() {
        game.togglePause();
      }

      function restartGame() {
        document.getElementById("pause-menu").classList.add("hidden");
        document.getElementById("gameover-menu").classList.add("hidden");
        game.start(game.gameMode);
      }

      function quitToMenu() {
        game.running = false;
        game.paused = false;
        document.getElementById("pause-menu").classList.add("hidden");
        document.getElementById("gameover-menu").classList.add("hidden");
        document.getElementById("main-menu").classList.remove("hidden");
        document.getElementById("touch-controls").classList.remove("active");
      }

      function showGameOver(isRecord) {
        const stats = document.getElementById("gameover-stats");

        const winner = game.scoreP1 > game.scoreP2 ? "Joueur 1" : "Joueur 2";
        const finalScore = Math.max(game.scoreP1, game.scoreP2);
        const mins = Math.floor(game.gameTime / 60000);
        const secs = Math.floor((game.gameTime % 60000) / 1000);

        stats.innerHTML = `
    <div class="stat-item">
      <div class="label">Vainqueur</div>
      <div class="value">${winner}</div>
    </div>
    <div class="stat-item">
      <div class="label">Score Final</div>
      <div class="value">${game.scoreP1} - ${game.scoreP2}</div>
    </div>
    <div class="stat-item">
      <div class="label">Temps</div>
      <div class="value">${mins}:${secs.toString().padStart(2, "0")}</div>
    </div>
    <div class="stat-item">
      <div class="label">Mode</div>
      <div class="value">${game.gameMode}</div>
    </div>
  `;

        document.getElementById("new-record").style.display = isRecord
          ? "block"
          : "none";
        document.getElementById("gameover-menu").classList.remove("hidden");
      }

      function showSettings() {
        // Charger valeurs actuelles
        document.getElementById("sfx-vol").value = game.settings.sfxVolume;
        document.getElementById("sfx-display").textContent =
          game.settings.sfxVolume + "%";
        document.getElementById("ai-difficulty").value =
          game.settings.aiDifficulty;
        document.getElementById("ball-speed").value = game.settings.ballSpeed;
        document.getElementById("show-trail").checked = game.settings.showTrail;
        document.getElementById("show-particles").checked =
          game.settings.showParticles;
        document.getElementById("screen-shake").checked =
          game.settings.screenShake;
        document.getElementById("touch-enabled").checked =
          game.settings.touchEnabled;

        document.getElementById("main-menu").classList.add("hidden");
        document.getElementById("settings-menu").classList.remove("hidden");
      }

      function hideSettings() {
        document.getElementById("settings-menu").classList.add("hidden");
        document.getElementById("main-menu").classList.remove("hidden");
      }

      function saveSettings() {
        game.settings = {
          sfxVolume: parseInt(document.getElementById("sfx-vol").value),
          aiDifficulty: document.getElementById("ai-difficulty").value,
          ballSpeed: document.getElementById("ball-speed").value,
          showTrail: document.getElementById("show-trail").checked,
          showParticles: document.getElementById("show-particles").checked,
          screenShake: document.getElementById("screen-shake").checked,
          touchEnabled: document.getElementById("touch-enabled").checked,
        };

        game.saveSettings();
        hideSettings();
      }

      function showRecords() {
        const list = document.getElementById("records-list");

        if (game.records.length === 0) {
          list.innerHTML =
            '<p style="text-align:center;color:#888;padding:30px;">Aucun record enregistré</p>';
        } else {
          list.innerHTML = game.records
            .map((r, i) => {
              const className =
                i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
              const date = new Date(r.date).toLocaleDateString();

              return `
        <div class="record-item ${className}">
          <div class="info">
            <div class="mode">#${i + 1} • ${r.mode} • ${date}</div>
            <div class="score">${r.winner} - ${r.score} points</div>
          </div>
        </div>
      `;
            })
            .join("");
        }

        document.getElementById("main-menu").classList.add("hidden");
        document.getElementById("records-menu").classList.remove("hidden");
      }

      function hideRecords() {
        document.getElementById("records-menu").classList.add("hidden");
        document.getElementById("main-menu").classList.remove("hidden");
      }

      function clearRecords() {
        if (confirm("Effacer tous les records ?")) {
          localStorage.removeItem("pong-records");
          game.records = [];
          showRecords();
        }
      }

      // ============================================
      // INITIALISATION
      // ============================================
      window.addEventListener("load", () => {
        initGame();
      });
    </script>
    <script src="arcade-config.js"></script>
    <script src="arcade-local-store.js"></script>
    <script src="arcade-game-bridge.js"></script>
  </body>
</html>
