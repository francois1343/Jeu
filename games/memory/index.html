  <body>
    <a
      class="arcade-home-link"
      href="../../index.html"
      aria-label="Retour à l'accueil"

    >

    <!-- Particules de fond -->
    <div class="particles" id="particles"></div>

    <!-- ===== MENU PRINCIPAL ===== -->
    <div class="screen menu-screen" id="menuScreen">
      <div class="menu-container">
        <div class="game-logo">🧩</div>
        <h1 class="game-title">Memory</h1>
        <p class="game-subtitle">Trouvez toutes les paires !</p>

        <div class="difficulty-section">
          <div class="section-title">Difficulté</div>
          <div class="difficulty-cards">
            <button
              type="button"

            <button

      <div class="cards-container">

    <!-- ===== ÉCRAN RÉSULTAT ===== -->
    <div class="result-overlay" id="resultOverlay">
      <div class="result-content">
        <div class="result-icon">🏆</div>
        <h2 class="result-title">Bravo !</h2>

        <div class="result-stats">
          <div class="result-stat highlight">

          </div>

        <div class="result-buttons">

    <!-- ===== ÉCRAN CLASSEMENT ===== -->
    <div class="screen leaderboard-screen hidden" id="leaderboardScreen">
      <div class="leaderboard-header">
        <div class="leaderboard-icon">🏆</div>
        <h2 class="leaderboard-title">Classement</h2>
      </div>

      <div class="leaderboard-tabs">
        <button type="button" class="tab-btn active" onclick="showTab(8, this)">
          🌱 Facile
        </button>
        <button type="button" class="tab-btn" onclick="showTab(12, this)">🌿 Normal</button>
        <button type="button" class="tab-btn" onclick="showTab(24, this)">
          🌳 Difficile
        </button>

      <div class="leaderboard-list" id="leaderboardList"></div>

      <button type="button" class="back-btn-large" onclick="backToMenu()">
        ← Retour au menu
      </button>

    <!-- Confettis -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const THEMES = {
        animals: [
          "🐶",
          "🐱",
          "🐭",
          "🐹",
          "🐰",
          "🦊",
          "🐻",
          "🐼",
          "🐨",
          "🐯",
          "🦁",
          "🐮",
        ],
        food: [
          "🍕",
          "🍔",
          "🍟",
          "🌭",
          "🍿",
          "🧁",
          "🍩",
          "🍪",
          "🍫",
          "🍬",
          "🍭",
          "🍰",
        ],
        sports: [
          "⚽",
          "🏀",
          "🏈",
          "⚾",
          "🎾",
          "🏐",
          "🏉",
          "🎱",
          "🏓",
          "🏸",
          "🥊",
          "⛳",
        ],
        nature: [
          "🌸",
          "🌺",
          "🌻",
          "🌹",
          "🌷",
          "🌼",
          "🍀",
          "🌵",
          "🌴",
          "🍄",
          "🌙",
          "⭐",
        ],
      };

      Object.assign(THEMES, {
        neon: ["◈", "◇", "○", "△", "□", "✦", "✧", "✹", "☄", "⌁", "◉", "◌"],
        music: ["♫", "♪", "♬", "♩", "♭", "♮", "♯", "𝄞", "𝄢", "𝄫", "𝄪", "𝄡"],
        travel: ["✈", "⌂", "⌖", "⌘", "⚓", "⛺", "⛰", "☀", "☾", "⌁", "✦", "◉"],
      });

      const GRID_CONFIG = {
        8: { cols: 4, rows: 2, class: "grid-4x2" },
        12: { cols: 4, rows: 3, class: "grid-4x3" },
        24: { cols: 6, rows: 4, class: "grid-6x4" },
      };

      const SCORE_MULTIPLIER = { 8: 1, 12: 1.5, 24: 2 };
      const MODE_CONFIG = {
        classic: { name: "Classique", note: "Trouve toutes les paires a ton rythme.", scoreBonus: 1, previewMs: 0 },
        preview: { name: "Observation", note: "Observe la grille pendant 2 secondes avant le depart.", scoreBonus: 1.1, previewMs: 2200 },
        rush: { name: "Rush", note: "Aucun apercu, mais un bonus de score de 25%.", scoreBonus: 1.25, previewMs: 0 },
        random: { name: "Aleatoire", note: "Theme et format tires au sort a chaque partie.", scoreBonus: 1.15, previewMs: 0, random: true },
      };

      // ============================================
      // ÉTAT DU JEU
      // ============================================
      const game = {
        gridSize: 8,
        theme: "animals",
        cards: [],
        flipped: [],
        matched: 0,
        moves: 0,
        startTime: 0,
        elapsed: 0,
        timer: null,
        locked: false,
        mode: "classic",
        activeMode: "classic",
        activeTheme: "animals",
        previewTimer: null,
        highscores: { 8: [], 12: [], 24: [] },
      };
      let leaderboardMode = "all";
      let leaderboardSize = 8;

      // ============================================
      // INITIALISATION
      // ============================================
      function init() {
        loadHighscores();
        createParticles();
        enhanceMemoryMenu();
      }

      function enhanceMemoryMenu() {
        const menu = document.querySelector(".menu-container");
        if (!menu) return;
        menu.classList.add("memory-2026");
        const eyebrow = document.createElement("div");
        eyebrow.className = "memory-eyebrow";
        eyebrow.textContent = "NEURAL MATCH // MEMOIRE VISUELLE";
        menu.prepend(eyebrow);
        const subtitle = menu.querySelector(".game-subtitle");
        if (subtitle) subtitle.textContent = "Repere les motifs, memorise la grille et enchaine les paires.";
        menu.querySelectorAll(".diff-card, .theme-pill").forEach((choice) => {
          choice.setAttribute("role", "button");
          choice.setAttribute("tabindex", "0");
          choice.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); choice.click(); }
          });
        });
        const themePills = menu.querySelector(".theme-pills");
        if (themePills) {
          [
            ["neon", "Neon"],
            ["music", "Musique"],
            ["travel", "Voyage"],
          ].forEach(([theme, label]) => {
            const pill = document.createElement("button");
            pill.type = "button";
            pill.className = "theme-pill";
            pill.textContent = label;
            pill.addEventListener("click", () => selectTheme(theme, pill));
            themePills.appendChild(pill);
          });
        }
        const leaderboardHeader = document.querySelector(".leaderboard-title");
        if (leaderboardHeader) leaderboardHeader.textContent = "Mes records";
        const leaderboardTabs = document.querySelector(".leaderboard-tabs");
        if (leaderboardTabs && !document.getElementById("memoryLbSummary")) {
          const controls = document.createElement("div");
          controls.innerHTML = '<div class="memory-lb-filters"><button type="button" class="memory-lb-filter active" data-mode="all">Tous</button><button type="button" class="memory-lb-filter" data-mode="classic">Classique</button><button type="button" class="memory-lb-filter" data-mode="preview">Observation</button><button type="button" class="memory-lb-filter" data-mode="rush">Rush</button></div><p class="memory-lb-summary" id="memoryLbSummary"></p>';
          leaderboardTabs.after(controls);
          controls.querySelectorAll(".memory-lb-filter").forEach((button) => button.addEventListener("click", () => setLeaderboardMode(button.dataset.mode, button)));
        }
        const playButton = menu.querySelector(".play-btn");
        if (playButton) {
          const modes = document.createElement("section");
          modes.innerHTML = '<div class="section-title">Format de partie</div><div class="memory-mode-grid"><button type="button" class="memory-mode-btn active" data-mode="classic"><strong>Classique</strong>Sans pression</button><button type="button" class="memory-mode-btn" data-mode="preview"><strong>Observation</strong>Apercu de la grille</button><button type="button" class="memory-mode-btn" data-mode="rush"><strong>Rush</strong>Bonus x1,25</button><button type="button" class="memory-mode-btn" data-mode="random"><strong>Aleatoire</strong>Tout est tire au sort</button></div><p class="memory-mode-note" id="memoryModeNote"></p>';
          playButton.before(modes);
          modes.querySelectorAll(".memory-mode-btn").forEach((button) => button.addEventListener("click", () => selectMode(button.dataset.mode, button)));
          updateModeNote();
        }
      }

      function selectMode(mode, button) {
        if (!MODE_CONFIG[mode]) return;
        game.mode = mode;
        document.querySelectorAll(".memory-mode-btn").forEach((item) => item.classList.remove("active"));
        if (button) button.classList.add("active");
        updateModeNote();
        playSound("click");
      }

      function updateModeNote() {
        const note = document.getElementById("memoryModeNote");
        if (note) note.textContent = MODE_CONFIG[game.mode].note;
      }

      function createParticles() {
        const container = document.getElementById("particles");
        const colors = ["#00d4ff", "#00ff88", "#ffd93d", "#f093fb"];

        for (let i = 0; i < 15; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          const size = 80 + Math.random() * 120;
          p.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      background: radial-gradient(circle, ${colors[i % colors.length]}, transparent);
      animation-delay: ${Math.random() * 5}s;
    `;
          container.appendChild(p);
        }
      }

      // ============================================
      // MENU SELECTION
      // ============================================
      function selectDifficulty(size, el) {
        document
          .querySelectorAll(".diff-card")
          .forEach((c) => {
            c.classList.remove("selected");
            c.setAttribute("aria-pressed", "false");
          });
        el.classList.add("selected");
        el.setAttribute("aria-pressed", "true");
        game.gridSize = size;
        playSound("click");
      }

      function selectTheme(theme, el) {
        document
          .querySelectorAll(".theme-pill")
          .forEach((p) => {
            p.classList.remove("selected");
            p.setAttribute("aria-pressed", "false");
          });
        el.classList.add("selected");
        el.setAttribute("aria-pressed", "true");
        game.theme = theme;
        playSound("click");
      }

      // ============================================
      // DÉMARRAGE DU JEU
      // ============================================
      function startGame() {
        if (game.mode === "random") {
          const modes = ["classic", "preview", "rush"];
          const themes = Object.keys(THEMES);
          game.activeMode = modes[Math.floor(Math.random() * modes.length)];
          game.activeTheme = themes[Math.floor(Math.random() * themes.length)];
        } else {
          game.activeMode = game.mode;
          game.activeTheme = game.theme;
        }
        window.ArcadeGameSession?.start({ gridSize: game.gridSize, theme: game.activeTheme, mode: game.activeMode });
        // Reset
        game.cards = [];
        game.flipped = [];
        game.matched = 0;
        game.moves = 0;
        game.elapsed = 0;
        game.locked = false;

        if (game.timer) clearInterval(game.timer);
        if (game.previewTimer) clearTimeout(game.previewTimer);
        document.getElementById("previewBanner")?.remove();
        document.querySelector(".cards-container")?.classList.remove("preview-active");

        // Générer les cartes
        const pairCount = game.gridSize / 2;
        const emojis = THEMES[game.activeTheme].slice(0, pairCount);
        const deck = [...emojis, ...emojis];

        // Mélanger (Fisher-Yates)
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        game.cards = deck.map((emoji, i) => ({
          id: i,
          emoji: emoji,
          flipped: false,
          matched: false,
        }));

        // Afficher
        renderGrid();
        updateStats();
        showScreen("gameScreen");

        const mode = MODE_CONFIG[game.activeMode];
        if (mode.previewMs) {
          game.locked = true;
          game.cards.forEach((card) => (card.flipped = true));
          document.getElementById("cardsGrid").closest(".cards-container").classList.add("preview-active");
          const banner = document.createElement("div");
          banner.className = "preview-banner";
          banner.id = "previewBanner";
          banner.textContent = "OBSERVE LA GRILLE";
          document.querySelector(".cards-container").prepend(banner);
          renderGrid();
          game.previewTimer = setTimeout(() => {
            game.cards.forEach((card) => (card.flipped = false));
            game.locked = false;
            document.getElementById("cardsGrid").closest(".cards-container").classList.remove("preview-active");
            document.getElementById("previewBanner")?.remove();
            renderGrid();
            startTimer();
          }, mode.previewMs);
        } else {
          startTimer();
        }

        playSound("start");
      }

      function startTimer() {
        game.startTime = Date.now();
        game.timer = setInterval(updateTimer, 100);
      }

      function renderGrid() {
        const grid = document.getElementById("cardsGrid");
        const config = GRID_CONFIG[game.gridSize];

        grid.className = "cards-grid " + config.class;
        grid.innerHTML = "";

        game.cards.forEach((card, index) => {
          const cardEl = document.createElement("div");
          cardEl.className = "card";
          cardEl.dataset.index = index;
          cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">?</div>
        <div class="card-face card-front">${card.emoji}</div>
      </div>
    `;
          cardEl.addEventListener("click", () => flipCard(index));
          grid.appendChild(cardEl);
        });

        document.getElementById("pairsDisplay").textContent =
          `0/${game.gridSize / 2}`;
      }

      // ============================================
      // LOGIQUE DE JEU
      // ============================================
      function flipCard(index) {
        if (game.locked) return;

        const card = game.cards[index];
        if (card.flipped || card.matched) return;

        // Flip
        card.flipped = true;
        game.flipped.push(index);

        const cardEl = document.querySelector(`.card[data-index="${index}"]`);
        cardEl.classList.add("flipped");

        playSound("flip");

        // Check pair
        if (game.flipped.length === 2) {
          game.moves++;
          updateStats();
          checkMatch();
        }
      }

      function checkMatch() {
        game.locked = true;

        const [i1, i2] = game.flipped;
        const c1 = game.cards[i1];
        const c2 = game.cards[i2];

        const el1 = document.querySelector(`.card[data-index="${i1}"]`);
        const el2 = document.querySelector(`.card[data-index="${i2}"]`);

        if (c1.emoji === c2.emoji) {
          // Match!
          setTimeout(() => {
            c1.matched = true;
            c2.matched = true;
            el1.classList.add("matched");
            el2.classList.add("matched");

            game.matched++;
            updateStats();

            playSound("match");
            vibrate(50);

            // Victory?
            if (game.matched === game.gridSize / 2) {
              setTimeout(endGame, 400);
            }

            game.flipped = [];
            game.locked = false;
          }, 300);
        } else {
          // No match
          el1.classList.add("wrong");
          el2.classList.add("wrong");

          setTimeout(() => {
            c1.flipped = false;
            c2.flipped = false;
            el1.classList.remove("flipped", "wrong");
            el2.classList.remove("flipped", "wrong");

            playSound("wrong");

            game.flipped = [];
            game.locked = false;
          }, 800);
        }
      }

      // ============================================
      // TIMER & STATS
      // ============================================
      function updateTimer() {
        game.elapsed = Date.now() - game.startTime;
        const sec = Math.floor(game.elapsed / 1000);
        const min = Math.floor(sec / 60);
        document.getElementById("timeDisplay").textContent =
          `${min}:${(sec % 60).toString().padStart(2, "0")}`;
      }

      function updateStats() {
        document.getElementById("movesDisplay").textContent = game.moves;
        document.getElementById("pairsDisplay").textContent =
          `${game.matched}/${game.gridSize / 2}`;

        const progress = (game.matched / (game.gridSize / 2)) * 100;
        document.getElementById("progressBar").style.width = progress + "%";
      }

      // ============================================
      // FIN DE PARTIE
      // ============================================
      function endGame() {
        clearInterval(game.timer);

        // Calculate score
        const timeSec = Math.floor(game.elapsed / 1000);
        const baseScore = 10000;
        const timePenalty = timeSec * 10;
        const movesPenalty = game.moves * 20;
        const multiplier = SCORE_MULTIPLIER[game.gridSize] * MODE_CONFIG[game.activeMode].scoreBonus;

        const score = Math.max(
          100,
          Math.floor((baseScore - timePenalty - movesPenalty) * multiplier),
        );
        window.ArcadeGameSession?.win({ score, moves: game.moves, timeSeconds: timeSec });

        // Check record
        const isRecord = saveScore(score, timeSec);

        // Display
        const min = Math.floor(timeSec / 60);
        const sec = timeSec % 60;

        document.getElementById("finalScore").textContent =
          score.toLocaleString();
        document.getElementById("finalTime").textContent =
          `${min}:${sec.toString().padStart(2, "0")}`;
        document.getElementById("finalMoves").textContent = game.moves;
        document.getElementById("newRecordBadge").style.display = isRecord
          ? "block"
          : "none";

        document.getElementById("resultOverlay").classList.add("show");

        if (isRecord) {
          celebrate();
          playSound("victory");
        } else {
          playSound("complete");
        }
      }

      function saveScore(score, time) {
        const entry = {
          score: score,
          moves: game.moves,
          time: time,
          mode: game.activeMode,
          theme: game.activeTheme,
          date: Date.now(),
        };

        const scores = game.highscores[game.gridSize];
        scores.push(entry);
        scores.sort((a, b) => b.score - a.score);
        game.highscores[game.gridSize] = scores.slice(0, 36);

        localStorage.setItem("memory-scores", JSON.stringify(game.highscores));

        return scores[0].date === entry.date;
      }

      // ============================================
      // NAVIGATION
      // ============================================
      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        document.getElementById(id).classList.remove("hidden");
      }

      function confirmQuit() {
        if (confirm("Quitter la partie ?")) {
          clearInterval(game.timer);
          clearTimeout(game.previewTimer);
          document.getElementById("previewBanner")?.remove();
          document.querySelector(".cards-container")?.classList.remove("preview-active");
          showScreen("menuScreen");
        }
      }

      function restartGame() {
        document.getElementById("resultOverlay").classList.remove("show");
        startGame();
      }

      function backToMenu() {
        document.getElementById("resultOverlay").classList.remove("show");
        showScreen("menuScreen");
      }

      // ============================================
      // CLASSEMENT
      // ============================================
      function showLeaderboard() {
        showScreen("leaderboardScreen");
        showTab(8, document.querySelector(".tab-btn"));
      }

      function showTab(size, btn) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        const list = document.getElementById("leaderboardList");
        const scores = game.highscores[size];

        if (!scores.length) {
          list.innerHTML = `
      <div class="lb-empty">
        <div class="lb-empty-icon">🎮</div>
        <p>Aucun score</p>
        <p style="font-size: 12px; margin-top: 8px;">Jouez pour apparaître ici !</p>
      </div>
    `;
          return;
        }

        list.innerHTML = scores
          .map((s, i) => {
            const rc =
              i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
            const medal = ["🥇", "🥈", "🥉"][i] || i + 1;
            const min = Math.floor(s.time / 60);
            const sec = s.time % 60;
            const date = new Date(s.date).toLocaleDateString("fr-FR");

            return `
      <div class="lb-item ${rc}">
        <div class="lb-rank ${rc}">${medal}</div>
        <div class="lb-info">
          <div class="lb-score">${s.score.toLocaleString()} pts</div>
          <div class="lb-details">${s.moves} coups • ${min}:${sec.toString().padStart(2, "0")}</div>
        </div>
        <div class="lb-date">${date}</div>
      </div>
    `;
          })
          .join("");
      }

      // Classement local enrichi : filtres par format et lecture plus rapide.
      function showLeaderboard() {
        showScreen("leaderboardScreen");
        const tab = document.querySelector(`.tab-btn[onclick*="${game.gridSize}"]`);
        showTab(game.gridSize, tab || document.querySelector(".tab-btn"));
      }

      function setLeaderboardMode(mode, button) {
        leaderboardMode = mode;
        document.querySelectorAll(".memory-lb-filter").forEach((item) => item.classList.remove("active"));
        if (button) button.classList.add("active");
        renderLeaderboard();
      }

      function showTab(size, button) {
        leaderboardSize = size;
        document.querySelectorAll(".tab-btn").forEach((item) => item.classList.remove("active"));
        if (button) button.classList.add("active");
        renderLeaderboard();
      }

      function renderLeaderboard() {
        const list = document.getElementById("leaderboardList");
        const summary = document.getElementById("memoryLbSummary");
        const source = Array.isArray(game.highscores[leaderboardSize]) ? game.highscores[leaderboardSize] : [];
        const scores = source.filter((score) => leaderboardMode === "all" || (score.mode || "classic") === leaderboardMode);
        if (summary) {
          const best = scores[0] ? scores[0].score.toLocaleString() + " pts" : "aucun record";
          summary.textContent = scores.length + " partie" + (scores.length > 1 ? "s" : "") + " - meilleur : " + best + " - appareil local";
        }
        if (!scores.length) {
          list.innerHTML = '<div class="lb-empty"><div class="lb-empty-icon">+</div><p>Pas encore de record ici.</p><p style="font-size:12px;margin-top:8px;">Termine une partie pour l ajouter.</p></div>';
          return;
        }
        list.innerHTML = scores.map((score, index) => {
          const rank = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
          const mode = MODE_CONFIG[score.mode]?.name || "Classique";
          const min = Math.floor(score.time / 60);
          const sec = score.time % 60;
          return `<div class="lb-item ${rank}"><div class="lb-rank ${rank}">${index + 1}</div><div class="lb-info"><div class="lb-score">${score.score.toLocaleString()} pts</div><div class="lb-details">${score.moves} coups - ${min}:${sec.toString().padStart(2, "0")}</div><span class="lb-mode-tag">${mode}</span></div><div class="lb-date">${new Date(score.date).toLocaleDateString("fr-FR")}</div></div>`;
        }).join("");
      }

      function loadHighscores() {
        try {
          const saved = localStorage.getItem("memory-scores");
          if (saved) game.highscores = JSON.parse(saved);
        } catch (e) {}
      }

      // ============================================
      // EFFETS
      // ============================================
      function celebrate() {
        const colors = ["#ffd93d", "#ff6b6b", "#00ff88", "#00d4ff", "#f093fb"];
        const container = document.getElementById("confettiContainer");

        for (let i = 0; i < 50; i++) {
          const c = document.createElement("div");
          c.style.cssText = `
      position: absolute;
      width: ${5 + Math.random() * 8}px;
      height: ${5 + Math.random() * 8}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      left: ${Math.random() * 100}%;
      top: -10px;
      border-radius: ${Math.random() > 0.5 ? "50%" : "2px"};
    `;
          container.appendChild(c);

          c.animate(
            [
              { transform: "translateY(0) rotate(0)", opacity: 1 },
              {
                transform: `translateY(${window.innerHeight + 50}px) rotate(${Math.random() * 720}deg)`,
                opacity: 0,
              },
            ],
            {
              duration: 2000 + Math.random() * 1500,
              easing: "cubic-bezier(0.25, 0.46, 0.45, 0.94)",
            },
          ).onfinish = () => c.remove();
        }
      }

      function vibrate(ms) {
        if (navigator.vibrate) navigator.vibrate(ms);
      }

      function playSound(type) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.connect(gain);
          gain.connect(ctx.destination);

          const now = ctx.currentTime;
          gain.gain.setValueAtTime(0.08, now);

          switch (type) {
            case "click":
              osc.frequency.setValueAtTime(600, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
              osc.start(now);
              osc.stop(now + 0.05);
              break;
            case "start":
              osc.frequency.setValueAtTime(400, now);
              osc.frequency.setValueAtTime(600, now + 0.1);
              osc.frequency.setValueAtTime(800, now + 0.2);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
              osc.start(now);
              osc.stop(now + 0.3);
              break;
            case "flip":
              osc.frequency.setValueAtTime(500, now);
              osc.frequency.setValueAtTime(700, now + 0.05);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
              osc.start(now);
              osc.stop(now + 0.1);
              break;
            case "match":
              osc.frequency.setValueAtTime(523, now);
              osc.frequency.setValueAtTime(659, now + 0.1);
              osc.frequency.setValueAtTime(784, now + 0.2);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
              osc.start(now);
              osc.stop(now + 0.35);
              break;
            case "wrong":
              osc.type = "sawtooth";
              osc.frequency.setValueAtTime(200, now);
              osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
              osc.start(now);
              osc.stop(now + 0.15);
              break;
            case "complete":
              osc.frequency.setValueAtTime(523, now);
              osc.frequency.setValueAtTime(659, now + 0.15);
              osc.frequency.setValueAtTime(784, now + 0.3);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
              osc.start(now);
              osc.stop(now + 0.5);
              break;
            case "victory":
              const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
              notes.forEach((f, i) =>
                osc.frequency.setValueAtTime(f, now + i * 0.08),
              );
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
              osc.start(now);
              osc.stop(now + 0.7);
              break;
          }
        } catch (e) {}
      }

      // ============================================
      // LANCEMENT
      // ============================================
      init();
    </script>
    <script src="../../js/core/arcade-config.js"></script>
    <script src="../../js/core/arcade-local-store.js"></script>
    <script src="../../js/core/arcade-game-bridge.js"></script>
  </body>
