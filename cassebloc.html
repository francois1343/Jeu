<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🧱 Casse-Briques</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0e1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      padding: 10px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    .hud {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .hud span {
      color: #888;
    }

    .hud strong {
      color: #00d4ff;
    }

    canvas {
      background: #111;
      border: 3px solid #00d4ff;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      display: block;
      touch-action: none;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 30px 50px;
      border-radius: 15px;
      border: 3px solid #00d4ff;
      text-align: center;
      z-index: 100;
    }

    .message.hidden {
      display: none;
    }

    .message h2 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #00d4ff;
    }

    .message p {
      color: #888;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    .controls {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }
  </style>
  <link rel="stylesheet" href="arcade-home.css">
</head>
<body>
  <a class="arcade-home-link" href="index.html" aria-label="Retour à l'accueil" title="Retour à l'accueil"><span class="arcade-home-icon" aria-hidden="true">⌂</span><span class="arcade-home-label">Accueil</span></a>

<h1>🧱 Casse-Briques</h1>

<div class="hud">
  <div><span>Score:</span> <strong id="score">0</strong></div>
  <div><span>Niveau:</span> <strong id="level">1</strong></div>
  <div><span>Vies:</span> <strong id="lives">❤️❤️❤️</strong></div>
</div>

<div style="position: relative;">
  <canvas id="game" width="600" height="500"></canvas>
  
  <div class="message" id="start-screen">
    <h2>🧱 Casse-Briques</h2>
    <p>Détruisez toutes les briques !</p>
    <button onclick="game.start()">▶️ Jouer</button>
  </div>
  
  <div class="message hidden" id="game-over">
    <h2>💀 Game Over</h2>
    <p>Score final: <strong id="final-score">0</strong></p>
    <button onclick="game.restart()">🔄 Rejouer</button>
  </div>
  
  <div class="message hidden" id="win-screen">
    <h2>🎉 Victoire !</h2>
    <p>Niveau <span id="completed-level">1</span> terminé !</p>
    <button onclick="game.nextLevel()">➡️ Niveau suivant</button>
  </div>
</div>

<div class="controls">
  ← → ou Souris pour bouger • Espace ou Clic pour lancer
</div>

<script>
// ============================================
// CONFIGURATION
// ============================================
const CONFIG = {
  width: 600,
  height: 500,
  
  // Raquette
  paddleWidth: 100,
  paddleHeight: 12,
  paddleSpeed: 8,
  
  // Balle
  ballRadius: 8,
  ballSpeed: 5,
  
  // Briques
  brickRows: 5,
  brickCols: 10,
  brickWidth: 54,
  brickHeight: 20,
  brickPadding: 4,
  brickOffsetTop: 50,
  brickOffsetLeft: 25,
  
  // Couleurs des lignes de briques
  brickColors: ['#ff4757', '#ffa502', '#ffdd59', '#7bed9f', '#70a1ff', '#a55eea']
};

// ============================================
// CLASSE PRINCIPALE
// ============================================
class Breakout {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    
    // État du jeu
    this.running = false;
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    
    // Raquette
    this.paddle = {
      x: CONFIG.width / 2 - CONFIG.paddleWidth / 2,
      y: CONFIG.height - 30,
      width: CONFIG.paddleWidth,
      height: CONFIG.paddleHeight,
      dx: 0
    };
    
    // Balle
    this.ball = {
      x: CONFIG.width / 2,
      y: CONFIG.height - 50,
      radius: CONFIG.ballRadius,
      dx: 0,
      dy: 0,
      launched: false
    };
    
    // Briques
    this.bricks = [];
    
    // Contrôles
    this.keys = { left: false, right: false };
    this.mouseX = null;
    
    this.setupControls();
    this.createBricks();
    this.draw();
  }
  
  // ===== CRÉATION DES BRIQUES =====
  createBricks() {
    this.bricks = [];
    
    const rows = CONFIG.brickRows + Math.floor(this.level / 2);
    
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < CONFIG.brickCols; col++) {
        this.bricks.push({
          x: CONFIG.brickOffsetLeft + col * (CONFIG.brickWidth + CONFIG.brickPadding),
          y: CONFIG.brickOffsetTop + row * (CONFIG.brickHeight + CONFIG.brickPadding),
          width: CONFIG.brickWidth,
          height: CONFIG.brickHeight,
          color: CONFIG.brickColors[row % CONFIG.brickColors.length],
          hits: row < this.level - 1 ? 2 : 1, // Briques plus résistantes aux niveaux supérieurs
          alive: true
        });
      }
    }
  }
  
  // ===== CONTRÔLES =====
  setupControls() {
    // Clavier
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') this.keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = true;
      if (e.key === ' ') {
        e.preventDefault();
        this.launchBall();
      }
    });
    
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') this.keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
    });
    
    // Souris
    this.canvas.addEventListener('mousemove', (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = CONFIG.width / rect.width;
      this.mouseX = (e.clientX - rect.left) * scaleX;
    });
    
    this.canvas.addEventListener('click', () => this.launchBall());
    
    // Tactile
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = CONFIG.width / rect.width;
      this.mouseX = (e.touches[0].clientX - rect.left) * scaleX;
    });
    
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.launchBall();
    });
  }
  
  launchBall() {
    if (!this.ball.launched && this.running) {
      this.ball.launched = true;
      const angle = -Math.PI / 4 - Math.random() * Math.PI / 2; // Entre -45° et -135°
      const speed = CONFIG.ballSpeed + this.level * 0.5;
      this.ball.dx = Math.cos(angle) * speed;
      this.ball.dy = Math.sin(angle) * speed;
    }
  }
  
  // ===== LOGIQUE DU JEU =====
  update() {
    if (!this.running) return;
    
    // Mouvement raquette (clavier)
    if (this.keys.left) this.paddle.x -= CONFIG.paddleSpeed;
    if (this.keys.right) this.paddle.x += CONFIG.paddleSpeed;
    
    // Mouvement raquette (souris/tactile)
    if (this.mouseX !== null) {
      const targetX = this.mouseX - this.paddle.width / 2;
      this.paddle.x += (targetX - this.paddle.x) * 0.15;
    }
    
    // Limites raquette
    this.paddle.x = Math.max(0, Math.min(CONFIG.width - this.paddle.width, this.paddle.x));
    
    // Balle attachée à la raquette
    if (!this.ball.launched) {
      this.ball.x = this.paddle.x + this.paddle.width / 2;
      this.ball.y = this.paddle.y - this.ball.radius - 2;
      return;
    }
    
    // Mouvement balle
    this.ball.x += this.ball.dx;
    this.ball.y += this.ball.dy;
    
    // Rebonds murs
    if (this.ball.x - this.ball.radius < 0 || this.ball.x + this.ball.radius > CONFIG.width) {
      this.ball.dx *= -1;
      this.ball.x = Math.max(this.ball.radius, Math.min(CONFIG.width - this.ball.radius, this.ball.x));
    }
    
    if (this.ball.y - this.ball.radius < 0) {
      this.ball.dy *= -1;
      this.ball.y = this.ball.radius;
    }
    
    // Rebond raquette
    if (this.ball.dy > 0 && this.ballHitsPaddle()) {
      // Angle basé sur la position d'impact
      const hitPos = (this.ball.x - this.paddle.x) / this.paddle.width; // 0 à 1
      const angle = (hitPos - 0.5) * Math.PI * 0.7; // -63° à +63°
      const speed = Math.sqrt(this.ball.dx ** 2 + this.ball.dy ** 2);
      
      this.ball.dx = Math.sin(angle) * speed;
      this.ball.dy = -Math.abs(Math.cos(angle) * speed);
      this.ball.y = this.paddle.y - this.ball.radius - 1;
    }
    
    // Collision briques
    for (const brick of this.bricks) {
      if (brick.alive && this.ballHitsBrick(brick)) {
        brick.hits--;
        
        if (brick.hits <= 0) {
          brick.alive = false;
          this.score += 10 * this.level;
        }
        
        this.ball.dy *= -1;
        this.updateHUD();
        
        // Victoire ?
        if (this.bricks.every(b => !b.alive)) {
          this.win();
        }
        
        break;
      }
    }
    
    // Perte de balle
    if (this.ball.y > CONFIG.height) {
      this.loseLife();
    }
  }
  
  ballHitsPaddle() {
    return this.ball.y + this.ball.radius >= this.paddle.y &&
           this.ball.y - this.ball.radius <= this.paddle.y + this.paddle.height &&
           this.ball.x >= this.paddle.x &&
           this.ball.x <= this.paddle.x + this.paddle.width;
  }
  
  ballHitsBrick(brick) {
    return this.ball.x + this.ball.radius > brick.x &&
           this.ball.x - this.ball.radius < brick.x + brick.width &&
           this.ball.y + this.ball.radius > brick.y &&
           this.ball.y - this.ball.radius < brick.y + brick.height;
  }
  
  loseLife() {
    this.lives--;
    this.updateHUD();
    
    if (this.lives <= 0) {
      this.gameOver();
    } else {
      this.resetBall();
    }
  }
  
  resetBall() {
    this.ball.launched = false;
    this.ball.x = this.paddle.x + this.paddle.width / 2;
    this.ball.y = this.paddle.y - this.ball.radius - 2;
    this.ball.dx = 0;
    this.ball.dy = 0;
  }
  
  // ===== RENDU =====
  draw() {
    const ctx = this.ctx;
    
    // Fond
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
    
    // Briques
    for (const brick of this.bricks) {
      if (!brick.alive) continue;
      
      // Ombre
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(brick.x + 3, brick.y + 3, brick.width, brick.height);
      
      // Brique
      ctx.fillStyle = brick.color;
      ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      
      // Reflet
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(brick.x, brick.y, brick.width, brick.height / 3);
      
      // Indicateur de résistance
      if (brick.hits > 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(brick.hits.toString(), brick.x + brick.width / 2, brick.y + brick.height / 2);
      }
    }
    
    // Raquette
    const gradient = ctx.createLinearGradient(this.paddle.x, this.paddle.y, this.paddle.x, this.paddle.y + this.paddle.height);
    gradient.addColorStop(0, '#00ffff');
    gradient.addColorStop(1, '#0088aa');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height, 6);
    ctx.fill();
    
    // Effet glow raquette
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00ffff';
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Balle
    ctx.beginPath();
    ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Indicateur de lancement
    if (!this.ball.launched && this.running) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Clic ou Espace pour lancer', CONFIG.width / 2, CONFIG.height / 2);
    }
  }
  
  // ===== GAME LOOP =====
  loop() {
    this.update();
    this.draw();
    requestAnimationFrame(() => this.loop());
  }
  
  // ===== ÉTATS DU JEU =====
  start() {
    document.getElementById('start-screen').classList.add('hidden');
    this.running = true;
    this.loop();
  }
  
  gameOver() {
    this.running = false;
    document.getElementById('final-score').textContent = this.score;
    document.getElementById('game-over').classList.remove('hidden');
  }
  
  win() {
    this.running = false;
    document.getElementById('completed-level').textContent = this.level;
    document.getElementById('win-screen').classList.remove('hidden');
  }
  
  nextLevel() {
    document.getElementById('win-screen').classList.add('hidden');
    this.level++;
    this.createBricks();
    this.resetBall();
    this.running = true;
    this.updateHUD();
  }
  
  restart() {
    document.getElementById('game-over').classList.add('hidden');
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.createBricks();
    this.resetBall();
    this.running = true;
    this.updateHUD();
  }
  
  updateHUD() {
    document.getElementById('score').textContent = this.score;
    document.getElementById('level').textContent = this.level;
    document.getElementById('lives').textContent = '❤️'.repeat(this.lives) + '🖤'.repeat(3 - this.lives);
  }
}

// ============================================
// LANCEMENT
// ============================================
const game = new Breakout();
</script>

</body>
</html>
