<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Néon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 50%, #0f1628 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ===== CONTAINER ===== */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 500px;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 3s ease infinite;
      text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .scores {
      display: flex;
      gap: 10px;
    }

    .score-box {
      background: linear-gradient(145deg, #1e2746, #2a3456);
      border: 2px solid #3d4f7c;
      border-radius: 10px;
      padding: 10px 20px;
      text-align: center;
      min-width: 90px;
    }

    .score-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-value {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    #score {
      color: #ffd93d;
      text-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
    }

    #best {
      color: #6bcb77;
      text-shadow: 0 0 10px rgba(107, 203, 119, 0.5);
    }

    /* ===== CONTROLS ===== */
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .ctrl-btn.new-game {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: #fff;
    }

    .ctrl-btn.undo {
      background: linear-gradient(135deg, #4d96ff, #3d7be0);
      color: #fff;
    }

    .ctrl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== GAME BOARD ===== */
    .board-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
    }

    .board {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1a1f3a, #252b4a);
      border: 4px solid #3d4f7c;
      border-radius: 15px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      box-shadow: 
        0 0 40px rgba(77, 150, 255, 0.2),
        inset 0 0 30px rgba(0, 0, 0, 0.3);
    }

    .cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    /* ===== TILES ===== */
    .tiles-container {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      padding: 10px;
      pointer-events: none;
    }

    .tile {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-radius: 10px;
      transition: all 0.15s ease-out;
      pointer-events: none;
    }

    .tile.new {
      animation: tile-appear 0.2s ease-out;
    }

    .tile.merged {
      animation: tile-merge 0.2s ease-out;
    }

    @keyframes tile-appear {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes tile-merge {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* ===== TILE COLORS ===== */
    .tile-2 {
      background: linear-gradient(135deg, #eee4da, #d6cdc4);
      color: #776e65;
      font-size: 40px;
    }

    .tile-4 {
      background: linear-gradient(135deg, #ede0c8, #d6c4a8);
      color: #776e65;
      font-size: 40px;
    }

    .tile-8 {
      background: linear-gradient(135deg, #f2b179, #e89550);
      color: #fff;
      font-size: 40px;
      box-shadow: 0 0 20px rgba(242, 177, 121, 0.5);
    }

    .tile-16 {
      background: linear-gradient(135deg, #f59563, #e07840);
      color: #fff;
      font-size: 40px;
      box-shadow: 0 0 20px rgba(245, 149, 99, 0.5);
    }

    .tile-32 {
      background: linear-gradient(135deg, #f67c5f, #e05a3a);
      color: #fff;
      font-size: 40px;
      box-shadow: 0 0 25px rgba(246, 124, 95, 0.6);
    }

    .tile-64 {
      background: linear-gradient(135deg, #f65e3b, #d84020);
      color: #fff;
      font-size: 40px;
      box-shadow: 0 0 30px rgba(246, 94, 59, 0.7);
    }

    .tile-128 {
      background: linear-gradient(135deg, #edcf72, #d4b445);
      color: #fff;
      font-size: 36px;
      box-shadow: 0 0 35px rgba(237, 207, 114, 0.6);
    }

    .tile-256 {
      background: linear-gradient(135deg, #edcc61, #d4b030);
      color: #fff;
      font-size: 36px;
      box-shadow: 0 0 40px rgba(237, 204, 97, 0.7);
    }

    .tile-512 {
      background: linear-gradient(135deg, #edc850, #d4ac20);
      color: #fff;
      font-size: 36px;
      box-shadow: 0 0 45px rgba(237, 200, 80, 0.8);
    }

    .tile-1024 {
      background: linear-gradient(135deg, #edc53f, #d4a810);
      color: #fff;
      font-size: 30px;
      box-shadow: 0 0 50px rgba(237, 197, 63, 0.9);
    }

    .tile-2048 {
      background: linear-gradient(135deg, #edc22e, #d4a400);
      color: #fff;
      font-size: 30px;
      box-shadow: 0 0 60px rgba(237, 194, 46, 1);
      animation: tile-glow 1s ease-in-out infinite alternate;
    }

    .tile-super {
      background: linear-gradient(135deg, #3c3a32, #1c1a12);
      color: #fff;
      font-size: 24px;
      box-shadow: 0 0 60px rgba(60, 58, 50, 0.8);
    }

    @keyframes tile-glow {
      0% { box-shadow: 0 0 60px rgba(237, 194, 46, 0.8); }
      100% { box-shadow: 0 0 80px rgba(237, 194, 46, 1), 0 0 100px rgba(237, 194, 46, 0.5); }
    }

    /* ===== MESSAGE OVERLAY ===== */
    .message-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 14, 26, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .message-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .message-title {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .message-title.win {
      color: #ffd93d;
      text-shadow: 0 0 30px rgba(255, 217, 61, 0.8);
    }

    .message-title.lose {
      color: #ff6b6b;
      text-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
    }

    .message-subtitle {
      font-size: 18px;
      color: #888;
      margin-bottom: 30px;
    }

    .message-btn {
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      margin: 5px;
    }

    .message-btn.primary {
      background: linear-gradient(135deg, #6bcb77, #4da65a);
      color: #fff;
    }

    .message-btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 2px solid #444;
    }

    .message-btn:hover {
      transform: scale(1.05);
    }

    /* ===== INSTRUCTIONS ===== */
    .instructions {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .key {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #444;
      border-radius: 5px;
      font-family: monospace;
      color: #888;
      margin: 0 2px;
    }

    /* ===== SCORE POPUP ===== */
    .score-popup {
      position: absolute;
      font-size: 20px;
      font-weight: bold;
      color: #ffd93d;
      pointer-events: none;
      animation: score-fly 0.8s ease-out forwards;
      text-shadow: 0 0 10px rgba(255, 217, 61, 0.8);
    }

    @keyframes score-fly {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }

    /* ===== TOUCH CONTROLS ===== */
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      margin-top: 20px;
    }

    .touch-btn {
      background: linear-gradient(145deg, #2a3456, #1e2746);
      border: 2px solid #3d4f7c;
      border-radius: 10px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .touch-btn:active {
      background: linear-gradient(145deg, #3d4f7c, #2a3456);
      transform: scale(0.95);
    }

    .touch-btn.empty {
      visibility: hidden;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      .title { font-size: 36px; }
      .score-box { padding: 8px 12px; min-width: 70px; }
      .score-value { font-size: 20px; }
      .board { padding: 8px; gap: 8px; }
      .tile { font-size: 90% !important; }
      .touch-controls { display: grid; }
    }

    @media (max-width: 360px) {
      .title { font-size: 28px; }
      .header { flex-wrap: wrap; justify-content: center; gap: 10px; }
      .board { padding: 6px; gap: 6px; }
    }

    /* ===== PARTICLES ===== */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: particle-fly 0.6s ease-out forwards;
    }

    @keyframes particle-fly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translateY(-30px); }
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Header -->
  <div class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Record</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn new-game" onclick="game.newGame()">
      🔄 Nouveau
    </button>
    <button class="ctrl-btn undo" id="undo-btn" onclick="game.undo()" disabled>
      ↩️ Annuler
    </button>
  </div>

  <!-- Game Board -->
  <div class="board-container">
    <div class="board" id="board">
      <!-- Cells générées par JS -->
    </div>
    <div class="tiles-container" id="tiles-container">
      <!-- Tiles générées par JS -->
    </div>

    <!-- Message Overlay -->
    <div class="message-overlay" id="message-overlay">
      <div class="message-title" id="message-title">Bravo !</div>
      <div class="message-subtitle" id="message-subtitle">Vous avez atteint 2048 !</div>
      <div>
        <button class="message-btn primary" id="message-btn-primary">Continuer</button>
        <button class="message-btn secondary" onclick="game.newGame()">Recommencer</button>
      </div>
    </div>
  </div>

  <!-- Instructions -->
  <div class="instructions">
    <span class="key">←</span>
    <span class="key">→</span>
    <span class="key">↑</span>
    <span class="key">↓</span>
    ou <strong>swipe</strong> pour déplacer les tuiles
  </div>

  <!-- Touch Controls (mobile) -->
  <div class="touch-controls" id="touch-controls">
    <div class="touch-btn empty"></div>
    <button class="touch-btn" onclick="game.move('up')">⬆️</button>
    <div class="touch-btn empty"></div>
    <button class="touch-btn" onclick="game.move('left')">⬅️</button>
    <div class="touch-btn empty"></div>
    <button class="touch-btn" onclick="game.move('right')">➡️</button>
    <div class="touch-btn empty"></div>
    <button class="touch-btn" onclick="game.move('down')">⬇️</button>
    <div class="touch-btn empty"></div>
  </div>
</div>

<script>
// ============================================
// 2048 GAME - COMPLETE VERSION
// ============================================

class Game2048 {
  constructor() {
    this.size = 4;
    this.grid = [];
    this.score = 0;
    this.best = 0;
    this.won = false;
    this.over = false;
    this.keepPlaying = false;
    this.history = [];
    this.maxHistory = 5;
    
    // DOM elements
    this.boardEl = document.getElementById('board');
    this.tilesEl = document.getElementById('tiles-container');
    this.scoreEl = document.getElementById('score');
    this.bestEl = document.getElementById('best');
    this.undoBtn = document.getElementById('undo-btn');
    this.messageOverlay = document.getElementById('message-overlay');
    
    // Audio context
    this.audioCtx = null;
    
    // Initialize
    this.createBoard();
    this.loadGame();
    this.setupControls();
  }

  // ============================================
  // INITIALIZATION
  // ============================================

  createBoard() {
    this.boardEl.innerHTML = '';
    for (let i = 0; i < this.size * this.size; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      this.boardEl.appendChild(cell);
    }
  }

  newGame() {
    this.grid = Array.from({ length: this.size }, () => Array(this.size).fill(0));
    this.score = 0;
    this.won = false;
    this.over = false;
    this.keepPlaying = false;
    this.history = [];
    
    this.hideMessage();
    this.addRandomTile();
    this.addRandomTile();
    this.updateDisplay();
    this.saveGame();
    this.playSound('start');
  }

  // ============================================
  // GAME LOGIC
  // ============================================

  addRandomTile() {
    const emptyCells = [];
    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        if (this.grid[r][c] === 0) {
          emptyCells.push({ r, c });
        }
      }
    }
    
    if (emptyCells.length > 0) {
      const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      return { r, c, value: this.grid[r][c], isNew: true };
    }
    return null;
  }

  move(direction) {
    if (this.over && !this.keepPlaying) return false;
    
    // Save state for undo
    this.saveState();
    
    let moved = false;
    const mergedPositions = [];
    
    // Get movement vectors
    const vectors = {
      up: { r: -1, c: 0 },
      down: { r: 1, c: 0 },
      left: { r: 0, c: -1 },
      right: { r: 0, c: 1 }
    };
    
    const vector = vectors[direction];
    
    // Build traversal order
    const traversals = this.buildTraversals(vector);
    
    // Track merges this turn
    const merged = Array.from({ length: this.size }, () => Array(this.size).fill(false));
    
    // Move tiles
    traversals.r.forEach(r => {
      traversals.c.forEach(c => {
        if (this.grid[r][c] !== 0) {
          const result = this.findFarthestPosition(r, c, vector);
          const next = result.next;
          
          // Check for merge
          if (next && this.grid[next.r][next.c] === this.grid[r][c] && !merged[next.r][next.c]) {
            // Merge
            const newValue = this.grid[r][c] * 2;
            this.grid[next.r][next.c] = newValue;
            this.grid[r][c] = 0;
            merged[next.r][next.c] = true;
            
            this.score += newValue;
            mergedPositions.push({ r: next.r, c: next.c, value: newValue });
            
            // Check win
            if (newValue === 2048 && !this.won) {
              this.won = true;
            }
            
            moved = true;
          } else if (result.farthest.r !== r || result.farthest.c !== c) {
            // Move without merge
            this.grid[result.farthest.r][result.farthest.c] = this.grid[r][c];
            this.grid[r][c] = 0;
            moved = true;
          }
        }
      });
    });
    
    if (moved) {
      const newTile = this.addRandomTile();
      this.updateDisplay(newTile, mergedPositions);
      this.playSound(mergedPositions.length > 0 ? 'merge' : 'move');
      
      // Show score popup for merges
      if (mergedPositions.length > 0) {
        const totalMerged = mergedPositions.reduce((sum, p) => sum + p.value, 0);
        this.showScorePopup(totalMerged);
      }
      
      // Check game state
      if (this.won && !this.keepPlaying) {
        this.showWin();
      } else if (this.isGameOver()) {
        this.over = true;
        this.showGameOver();
      }
      
      this.saveGame();
    } else {
      // Remove saved state if no move was made
      this.history.pop();
    }
    
    this.updateUndoButton();
    return moved;
  }

  buildTraversals(vector) {
    const traversals = { r: [], c: [] };
    
    for (let i = 0; i < this.size; i++) {
      traversals.r.push(i);
      traversals.c.push(i);
    }
    
    // Reverse order for right/down movements
    if (vector.r === 1) traversals.r.reverse();
    if (vector.c === 1) traversals.c.reverse();
    
    return traversals;
  }

  findFarthestPosition(r, c, vector) {
    let previous;
    
    do {
      previous = { r, c };
      r += vector.r;
      c += vector.c;
    } while (this.isWithinBounds(r, c) && this.grid[r][c] === 0);
    
    return {
      farthest: previous,
      next: this.isWithinBounds(r, c) ? { r, c } : null
    };
  }

  isWithinBounds(r, c) {
    return r >= 0 && r < this.size && c >= 0 && c < this.size;
  }

  isGameOver() {
    // Check for empty cells
    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        if (this.grid[r][c] === 0) return false;
      }
    }
    
    // Check for possible merges
    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        const val = this.grid[r][c];
        // Check right
        if (c < this.size - 1 && this.grid[r][c + 1] === val) return false;
        // Check down
        if (r < this.size - 1 && this.grid[r + 1][c] === val) return false;
      }
    }
    
    return true;
  }

  // ============================================
  // UNDO SYSTEM
  // ============================================

  saveState() {
    const state = {
      grid: this.grid.map(row => [...row]),
      score: this.score
    };
    
    this.history.push(state);
    
    if (this.history.length > this.maxHistory) {
      this.history.shift();
    }
  }

  undo() {
    if (this.history.length === 0) return;
    
    const state = this.history.pop();
    this.grid = state.grid;
    this.score = state.score;
    this.over = false;
    
    this.hideMessage();
    this.updateDisplay();
    this.updateUndoButton();
    this.saveGame();
    this.playSound('undo');
  }

  updateUndoButton() {
    this.undoBtn.disabled = this.history.length === 0;
  }

  // ============================================
  // DISPLAY
  // ============================================

  updateDisplay(newTile = null, mergedPositions = []) {
    // Update score
    this.scoreEl.textContent = this.score.toLocaleString();
    
    if (this.score > this.best) {
      this.best = this.score;
      this.saveBest();
    }
    this.bestEl.textContent = this.best.toLocaleString();
    
    // Render tiles
    this.renderTiles(newTile, mergedPositions);
    
    // Update undo button
    this.updateUndoButton();
  }

  renderTiles(newTile = null, mergedPositions = []) {
    this.tilesEl.innerHTML = '';
    
    const containerRect = this.tilesEl.getBoundingClientRect();
    const cellSize = (containerRect.width - 30) / this.size; // Account for gaps
    const gap = 10;
    
    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        const value = this.grid[r][c];
        if (value === 0) continue;
        
        const tile = document.createElement('div');
        
        // Determine tile class
        const tileClass = value <= 2048 ? `tile-${value}` : 'tile-super';
        tile.className = `tile ${tileClass}`;
        
        // Check if this is a new tile
        if (newTile && newTile.r === r && newTile.c === c) {
          tile.classList.add('new');
        }
        
        // Check if this tile was merged
        if (mergedPositions.some(p => p.r === r && p.c === c)) {
          tile.classList.add('merged');
          this.spawnParticles(c * (cellSize + gap) + cellSize / 2, r * (cellSize + gap) + cellSize / 2, value);
        }
        
        // Position
        tile.style.width = `${cellSize}px`;
        tile.style.height = `${cellSize}px`;
        tile.style.left = `${c * (cellSize + gap)}px`;
        tile.style.top = `${r * (cellSize + gap)}px`;
        
        tile.textContent = value;
        
        this.tilesEl.appendChild(tile);
      }
    }
  }

  showScorePopup(points) {
    const popup = document.createElement('div');
    popup.className = 'score-popup';
    popup.textContent = `+${points}`;
    popup.style.left = '50%';
    popup.style.top = '50%';
    popup.style.transform = 'translateX(-50%)';
    
    this.tilesEl.appendChild(popup);
    
    setTimeout(() => popup.remove(), 800);
  }

  spawnParticles(x, y, value) {
    const colors = this.getTileColor(value);
    
    for (let i = 0; i < 8; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.width = '8px';
      particle.style.height = '8px';
      particle.style.background = colors;
      
      const angle = (i / 8) * Math.PI * 2;
      const distance = 30 + Math.random() * 20;
      particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
      
      this.tilesEl.appendChild(particle);
      
      setTimeout(() => particle.remove(), 600);
    }
  }

  getTileColor(value) {
    const colors = {
      2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
      32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
      512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
    };
    return colors[value] || '#3c3a32';
  }

  // ============================================
  // MESSAGES
  // ============================================

  showWin() {
    document.getElementById('message-title').textContent = '🎉 Bravo !';
    document.getElementById('message-title').className = 'message-title win';
    document.getElementById('message-subtitle').textContent = 'Vous avez atteint 2048 !';
    document.getElementById('message-btn-primary').textContent = 'Continuer';
    document.getElementById('message-btn-primary').onclick = () => {
      this.keepPlaying = true;
      this.hideMessage();
    };
    
    this.messageOverlay.classList.add('show');
    this.playSound('win');
  }

  showGameOver() {
    document.getElementById('message-title').textContent = '💀 Game Over';
    document.getElementById('message-title').className = 'message-title lose';
    document.getElementById('message-subtitle').textContent = `Score final : ${this.score.toLocaleString()}`;
    document.getElementById('message-btn-primary').textContent = 'Réessayer';
    document.getElementById('message-btn-primary').onclick = () => this.newGame();
    
    this.messageOverlay.classList.add('show');
    this.playSound('gameover');
  }

  hideMessage() {
    this.messageOverlay.classList.remove('show');
  }

  // ============================================
  // CONTROLS
  // ============================================

  setupControls() {
    // Keyboard
    document.addEventListener('keydown', (e) => {
      const keyMap = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', s: 'down', a: 'left', d: 'right',
        z: 'up', q: 'left' // AZERTY support
      };
      
      if (keyMap[e.key]) {
        e.preventDefault();
        this.move(keyMap[e.key]);
      }
      
      // Undo with Ctrl+Z
      if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        this.undo();
      }
      
      // New game with N
      if (e.key === 'n' || e.key === 'N') {
        this.newGame();
      }
    });

    // Touch / Swipe
    let touchStartX, touchStartY;
    const minSwipe = 50;

    const container = document.querySelector('.board-container');
    
    container.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY) return;
      
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      
      if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
      
      if (Math.abs(dx) > Math.abs(dy)) {
        this.move(dx > 0 ? 'right' : 'left');
      } else {
        this.move(dy > 0 ? 'down' : 'up');
      }
      
      touchStartX = null;
      touchStartY = null;
    }, { passive: true });

    // Mouse swipe (for desktop testing)
    let mouseDown = false;
    let mouseStartX, mouseStartY;
    
    container.addEventListener('mousedown', (e) => {
      mouseDown = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
    });
    
    document.addEventListener('mouseup', (e) => {
      if (!mouseDown) return;
      mouseDown = false;
      
      const dx = e.clientX - mouseStartX;
      const dy = e.clientY - mouseStartY;
      
      if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
      
      if (Math.abs(dx) > Math.abs(dy)) {
        this.move(dx > 0 ? 'right' : 'left');
      } else {
        this.move(dy > 0 ? 'down' : 'up');
      }
    });
  }

  // ============================================
  // AUDIO
  // ============================================

  initAudio() {
    if (!this.audioCtx) {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playSound(type) {
    try {
      this.initAudio();
      
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      
      const now = this.audioCtx.currentTime;
      gain.gain.setValueAtTime(0.1, now);
      
      switch (type) {
        case 'move':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;
          
        case 'merge':
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
          break;
          
        case 'win':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.15);
          osc.frequency.setValueAtTime(784, now + 0.3);
          osc.frequency.setValueAtTime(1047, now + 0.45);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
          break;
          
        case 'gameover':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
          break;
          
        case 'undo':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.setValueAtTime(400, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;
          
        case 'start':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(262, now);
          osc.frequency.setValueAtTime(330, now + 0.1);
          osc.frequency.setValueAtTime(392, now + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
          break;
      }
    } catch (e) {
      // Audio not supported
    }
  }

  // ============================================
  // STORAGE
  // ============================================

  saveGame() {
    const data = {
      grid: this.grid,
      score: this.score,
      won: this.won,
      over: this.over,
      keepPlaying: this.keepPlaying
    };
    localStorage.setItem('2048-game', JSON.stringify(data));
  }

  loadGame() {
    this.loadBest();
    
    const saved = localStorage.getItem('2048-game');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        this.grid = data.grid;
        this.score = data.score;
        this.won = data.won || false;
        this.over = data.over || false;
        this.keepPlaying = data.keepPlaying || false;
        
        // Validate grid
        if (!this.grid || this.grid.length !== this.size) {
          this.newGame();
          return;
        }
        
        this.updateDisplay();
        
        if (this.over && !this.keepPlaying) {
          this.showGameOver();
        }
      } catch (e) {
        this.newGame();
      }
    } else {
      this.newGame();
    }
  }

  saveBest() {
    localStorage.setItem('2048-best', this.best.toString());
  }

  loadBest() {
    const saved = localStorage.getItem('2048-best');
    this.best = saved ? parseInt(saved) : 0;
    this.bestEl.textContent = this.best.toLocaleString();
  }
}

// ============================================
// INITIALIZATION
// ============================================

let game;

document.addEventListener('DOMContentLoaded', () => {
  game = new Game2048();
});
</script>
